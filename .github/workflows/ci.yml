name: CI

# Builds everything and runs the test suite on all three desktop OSes, on
# every push to any branch and on pull requests. (build-release.yml is the
# separate workflow that packages installers from master.)
#
# Every run also uploads "exports-<os>": a GIF, an MP4 (with and without
# sound) and a YouTube thumbnail rendered on that OS, so reel export can be
# checked by eye on macOS and Linux without owning either.
on:
  push:
  pull_request:
  # build-release.yml calls this same workflow so nothing is packaged and
  # published from a commit whose tests fail.
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DANA_EXPORT_DIR: ${{ github.workspace }}/exports
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install ffmpeg (for the MP4 export tests)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -q && sudo apt-get install -y -q ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1

      - name: Restore
        run: dotnet restore DanaProcessing.sln

      - name: Build
        run: dotnet build DanaProcessing.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test DanaProcessing.Tests/DanaProcessing.Tests.csproj
          -c Release --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=results.trx"
          --blame-hang-timeout 15m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            DanaProcessing.Tests/TestResults/*.trx
            DanaProcessing.Tests/TestResults/**/Sequence_*.xml

      - name: Upload exported reels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exports-${{ matrix.os }}
          path: exports/
          if-no-files-found: warn

  # The NuGet packages (a sketch made from the dotnet new template has to
  # build against them) and the VS Code extension (its tests and .vsix).
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pack
        run: |
          for p in DanaProcessing/DanaProcessing.csproj DanaProcessing.AvaloniaHost/DanaProcessing.AvaloniaHost.csproj templates/DanaProcessing.Templates/DanaProcessing.Templates.csproj; do
            dotnet pack "$p" -c Release -o packages -p:Version=0.0.0-ci
          done

      - name: A new sketch from the template builds against them
        run: |
          dotnet new install packages/DanaProcessing.Templates.0.0.0-ci.nupkg
          mkdir -p "$RUNNER_TEMP/check" && cd "$RUNNER_TEMP/check"
          dotnet new dana-sketch -n CheckSketch
          cd CheckSketch
          printf '<configuration><packageSources><add key="local" value="%s" /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>' "$GITHUB_WORKSPACE/packages" > nuget.config
          dotnet build

      - name: VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm test
          npx vsce package --no-dependencies -o ../packages/danaprocessing-ci.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/
