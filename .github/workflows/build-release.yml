name: Build and Release

on:
  push:
    branches: [ master ]
  workflow_dispatch: # te deja disparar un build a mano desde la pestaña Actions

permissions:
  contents: write # necesario para que el job pueda crear el Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # AJUSTAR: ruta real de tu .csproj de la IDE dentro del repo.
      # Asumo "DanaProcessing.Ide/DanaProcessing.Ide.csproj" por el
      # namespace que usan todas tus clases — si tu repo tiene otra
      # estructura, cambiá esta ruta en los tres pasos de abajo.
      - name: Restore
        run: dotnet restore DanaProcessing.Ide/DanaProcessing.Ide.csproj

      # Reads the <Version> the .csproj already declares (see
      # DanaProcessing.Ide.csproj) instead of inventing a separate number
      # here, so the tag on the GitHub Release always matches what
      # AppVersion.Current shows inside the running app. `-getProperty` is a
      # plain `dotnet msbuild` feature (no custom parsing script needed).
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = dotnet msbuild DanaProcessing.Ide/DanaProcessing.Ide.csproj -getProperty:Version
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # --self-contained embebe el runtime de .NET en el exe: quien lo
      # descargue no necesita tener .NET instalado. PublishSingleFile lo
      # empaqueta todo en un solo .exe en vez de una carpeta con decenas
      # de DLLs. Deliberadamente SIN trimming (-p:PublishTrimmed) — Roslyn
      # (SketchCompiler, RoslynCompletionEngine) carga tipos por reflection,
      # y el trimmer del linker recorta justamente lo que reflection no ve
      # usado estáticamente, así que trimear rompería la compilación de
      # sketches en tiempo de ejecución.
      - name: Publish
        run: >
          dotnet publish DanaProcessing.Ide/DanaProcessing.Ide.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      # ------------------------------------------------------------------
      # Code signing (Microsoft Artifact Signing, formerly "Trusted
      # Signing" — Microsoft renamed the service; old docs/URLs redirect)
      # — INACTIVE until the six secrets below exist in this repo's
      # Settings > Secrets and variables > Actions. Until then this step's
      # `if:` is false, it's skipped, and the build comes out exactly as
      # unsigned as it does today — nothing else in this workflow depends
      # on signing having happened.
      #
      # Why Artifact Signing over a traditional code-signing certificate:
      # it's Microsoft's own signing service, priced per-month rather than
      # per-year (Basic tier ~$10/mo as of writing, vs. $100-500+/yr for a
      # CA-issued cert), and because the signing key lives with Microsoft
      # rather than a third-party CA, Windows SmartScreen tends to build
      # reputation for it faster than a standard (non-EV) certificate
      # does. It still asks for real identity verification — that part
      # can't be automated from here, it's a one-time setup at
      # https://learn.microsoft.com/azure/artifact-signing/quickstart.
      #
      # Once that's done, add these 6 repo secrets and this step turns
      # itself on automatically, no further edits needed:
      #   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET  — from an
      #     Entra app registration / service principal with the "Artifact
      #     Signing Certificate Profile Signer" role on your account.
      #   TRUSTED_SIGNING_ENDPOINT     — region endpoint, e.g.
      #     https://eus.codesigning.azure.net (must match the Azure region
      #     you created the account in — a mismatch here is the #1 cause
      #     of a 403 at signing time).
      #   TRUSTED_SIGNING_ACCOUNT      — the Artifact Signing account name.
      #   TRUSTED_SIGNING_CERT_PROFILE — the certificate profile name
      #     (Public Trust profile, for a publicly-downloaded app like this).
      #
      # Action is azure/artifact-signing-action@v2 (the old
      # azure/trusted-signing-action name now just redirects to this repo).
      # The exclude-*-credential inputs below are recommended by the
      # action's own docs when authenticating with a client secret instead
      # of OIDC, so it doesn't waste time probing other credential types
      # first.
      - name: Sign executable
        if: ${{ secrets.AZURE_TENANT_ID != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: publish/win-x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      # ------------------------------------------------------------------

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath DanaProcessingIde-win-x64.zip

      # Además del Release de abajo, deja el zip como artifact del propio
      # run — útil para revisar un push a una rama que no sea main, o para
      # bajar un build puntual sin tocar el historial de Releases.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DanaProcessingIde-win-x64
          path: DanaProcessingIde-win-x64.zip

      # A new Release on every push to master, tagged with the app's own
      # version (e.g. "v0.1.0-beta") rather than an auto-incrementing build
      # number — re-pushing with the SAME <Version> updates that same
      # tag/release in place (softprops/action-gh-release does this
      # automatically when tag_name already exists), which is what you want
      # while iterating on a single beta. Bump <Version> in
      # DanaProcessing.Ide.csproj when you're ready to cut the next one.
      # GitHub always exposes the fixed URL:
      #   https://github.com/<owner>/<repo>/releases/latest/download/DanaProcessingIde-win-x64.zip
      # which redirects to whichever Release is marked "latest" — so the
      # download button on your README/site never has to change.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "DanaProcessing IDE v${{ steps.version.outputs.version }}"
          body: "Automated build from ${{ github.sha }}."
          make_latest: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: DanaProcessingIde-win-x64.zip