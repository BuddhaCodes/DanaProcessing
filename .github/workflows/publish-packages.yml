name: Publish packages

# Publishes the NuGet packages (DanaProcessing, DanaProcessing.AvaloniaHost,
# DanaProcessing.Templates) and the VS Code extension.
#
#   git tag packages-v1.0.0 && git push origin packages-v1.0.0
#
# The version comes from the tag. Each part publishes only when its secret
# exists (Settings > Secrets and variables > Actions):
#   NUGET_USER     your nuget.org username (profile name, not the email).
#                  nuget.org uses Trusted Publishing, no API key: in
#                  nuget.org > your name > Trusted Publishing, add a policy
#                  with owner BuddhaCodes, repository DanaProcessing and
#                  workflow file publish-packages.yml (no environment).
#   VSCE_PAT       an Azure DevOps token with Marketplace "Manage" for the
#                  "buddhacodes" publisher
# Without them the run still builds, tests and uploads the .nupkg and .vsix
# files as artifacts. Run it by hand (Actions > Publish packages) to try a
# version without a tag.
on:
  push:
    tags: [ 'packages-v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.1 or 1.1.0-preview.1)'
        required: true

permissions:
  contents: write
  id-token: write   # Trusted Publishing on nuget.org (OIDC)

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then v="${{ github.event.inputs.version }}"; else v="${GITHUB_REF_NAME#packages-v}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "Not a version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pack NuGet packages
        run: |
          for p in DanaProcessing/DanaProcessing.csproj DanaProcessing.AvaloniaHost/DanaProcessing.AvaloniaHost.csproj templates/DanaProcessing.Templates/DanaProcessing.Templates.csproj; do
            dotnet pack "$p" -c Release -o packages -p:Version=${{ steps.version.outputs.version }}
          done
          ls -la packages

      - name: Check the template builds against these packages
        run: |
          dotnet new install packages/DanaProcessing.Templates.${{ steps.version.outputs.version }}.nupkg
          mkdir -p "$RUNNER_TEMP/check" && cd "$RUNNER_TEMP/check"
          dotnet new dana-sketch -n CheckSketch
          cd CheckSketch
          printf '<configuration><packageSources><add key="local" value="%s" /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>' "$GITHUB_WORKSPACE/packages" > nuget.config
          dotnet build

      - name: Package the VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm test
          npx vsce package --no-dependencies -o "../packages/danaprocessing-${{ steps.version.outputs.version }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: packages/

      # Trusted Publishing: a one-hour key for this run, no secret key stored.
      - name: nuget.org login
        if: env.NUGET_USER != ''
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: env.NUGET_USER != ''
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: vscode-extension
        run: npx vsce publish --no-dependencies --packagePath "../packages/danaprocessing-${{ steps.version.outputs.version }}.vsix" -p "$VSCE_PAT"

      - name: GitHub release with the files
        if: startsWith(github.ref, 'refs/tags/packages-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" packages/*.nupkg packages/*.vsix
          --title "Packages ${{ steps.version.outputs.version }}"
          --notes "NuGet: DanaProcessing, DanaProcessing.AvaloniaHost, DanaProcessing.Templates ${{ steps.version.outputs.version }}. VS Code extension: danaprocessing-${{ steps.version.outputs.version }}.vsix (also on the Marketplace when published)."
